    <!-- Search filter bar at top of page (should never be picked as job action row) -->

      <button class="artdeco-pill">Date posted</button>
      <button class="artdeco-pill">Easy Apply</button>
      <button class="artdeco-pill">In my network</button>
    </div>

    <!-- Search results list on left -->
    <div class="_b124e55">
      <div class="_c992d11" data-job-id="501">
        <a href="/jobs/search-results/?currentJobId=501">Senior Frontend Engineer</a>
      </div>
      <div class="_c992d11" data-job-id="502">
        <a href="/jobs/search-results/?currentJobId=502">Staff Backend Engineer</a>
      </div>
    </div>

    <!-- Job details pane on right with hashed classes -->
    <main class="_790ec37f">
      <div class="_d882a10">
        <h1 class="_e441b22">Senior Frontend Engineer</h1>
        <div class="_f552c33">Acme Tech · Remote</div>

      <!-- Action row containing Apply and Save with flex layout -->
      <div class="_g663d44" style="display: flex; flex-direction: row; gap: 8px;">
        <a href="https://example.com/apply" class="_h774e55" aria-label="Apply on company website" role="button">Apply</a>
        <button class="_j885f66" aria-label="Save job">Save</button>
      </div>

      <!-- LinkedIn match box below buttons -->
      <div class="_k996a77">
        <div class="_l117b88">Your profile and resume match this role</div>
      </div>

      <!-- Description container: initially empty (About the job arrives lazily) -->
      <div class="_m228c99" id="lazy-description-container">
      </div>
    </main>
  </div>
</body>
</html>
